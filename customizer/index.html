<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Constructeur de Site — Mode Visuel</title>

    <!-- JSZip & FileSaver pour l'export ZIP instantané sans serveur -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <link rel="stylesheet" href="customizer.css" />
  </head>
  <body>
    <!-- Barre Supérieure -->
    <header class="top-bar">
      <div class="brand">
        <strong>✨ Website Builder</strong>
      </div>

      <div class="viewports">
        <button
          onclick="setViewport('desktop')"
          class="active"
          id="btn-desktop"
        >
          🖥️ Desktop
        </button>
        <button onclick="setViewport('mobile')" id="btn-mobile">
          📱 Mobile
        </button>
      </div>

      <div class="actions">
        <button onclick="resetConfig()" class="btn-secondary">
          Réinitialiser
        </button>
        <button onclick="saveConfig()" class="btn-primary">Enregistrer</button>
        <button onclick="exportSiteZip()" class="btn-success">
          🚀 Exporter mon site (ZIP)
        </button>
      </div>
    </header>

    <div class="builder-container">
      <!-- Barre Latérale de Contrôle -->
      <aside class="sidebar">
        <!-- Accordéon : Général -->
        <details open class="menu-group">
          <summary>🏠 Informations Générales</summary>
          <div class="group-content">
            <label>Nom du site</label>
            <input
              type="text"
              data-binding="site.name"
              oninput="updateField(this)"
            />

            <label>Slogan</label>
            <input
              type="text"
              data-binding="site.slogan"
              oninput="updateField(this)"
            />

            <label>Logo du site</label>
            <div class="image-picker">
              <img id="preview-logo" src="" class="thumb" />
              <input
                type="file"
                accept="image/*"
                onchange="uploadImage(this, 'site.logo', 'preview-logo')"
              />
            </div>
          </div>
        </details>

        <!-- Accordéon : Apparence -->
        <details class="menu-group">
          <summary>🎨 Thème & Couleurs</summary>
          <div class="group-content">
            <label>Couleur Principale</label>
            <input
              type="color"
              data-binding="theme.primary"
              onchange="updateField(this)"
            />

            <label>Couleur d'Arrière-Plan</label>
            <input
              type="color"
              data-binding="theme.bg"
              onchange="updateField(this)"
            />

            <label>Couleur Boutons</label>
            <input
              type="color"
              data-binding="theme.btnBg"
              onchange="updateField(this)"
            />

            <label>Texte Boutons</label>
            <input
              type="color"
              data-binding="theme.btnText"
              onchange="updateField(this)"
            />

            <label>Arrondi des Boutons (px)</label>
            <input
              type="range"
              min="0"
              max="30"
              data-binding="theme.btnRadius"
              oninput="updateField(this)"
            />

            <label>Police des Titres</label>
            <select
              data-binding="theme.fontHeading"
              onchange="updateField(this)"
            >
              <option value="'Cormorant Garamond', serif">
                Cormorant Garamond
              </option>
              <option value="'Playfair Display', serif">
                Playfair Display
              </option>
              <option value="'Montserrat', sans-serif">Montserrat</option>
            </select>
          </div>
        </details>

        <!-- Accordéon : Chambres -->
        <details class="menu-group">
          <summary>🏨 Chambres</summary>
          <div class="group-content" id="rooms-container">
            <!-- Les cartes de gestion des chambres seront injectées dynamiquement -->
          </div>
          <button onclick="addRoom()" class="btn-add">
            + Ajouter une chambre
          </button>
        </details>
      </aside>

      <!-- Aperçu Visuel Live (Iframe) -->
      <main class="preview-stage">
        <div id="wrapper" class="viewport-desktop">
          <iframe id="preview-frame" src="../index.html"></iframe>
        </div>
      </main>
    </div>

    <script src="customizer.js"></script>
  </body>
</html>
