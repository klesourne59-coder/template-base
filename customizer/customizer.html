<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panneau de Personnalisation</title>
    <link rel="stylesheet" href="customizer/customizer.css" />

    <!-- Librairies requises pour l'exportation ZIP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

    <!-- Script principal de gestion du customizer -->
    <script src="customizer/customizer.js" defer></script>
  </head>
  <body class="customizer-body">
    <!-- PANNEAU D'ÉDITION (GAUCHE) -->
    <aside class="customizer-sidebar">
      <header class="customizer-header">
        <h2>Éditeur de Site</h2>
        <div class="action-buttons">
          <button type="button" onclick="saveConfig()" class="btn-success">
            Enregistrer
          </button>
          <button type="button" onclick="resetConfig()" class="btn-warning">
            Réinitialiser
          </button>
          <button type="button" onclick="exportSiteZip()" class="btn-primary">
            Exporter (ZIP)
          </button>
        </div>
      </header>

      <div class="customizer-sections">
        <!-- INFORMATIONS GÉNÉRALES -->
        <details open class="config-group">
          <summary>En-tête & Textes généraux</summary>
          <div class="group-content">
            <label for="hero-title">Titre principal</label>
            <input
              type="text"
              id="hero-title"
              data-binding="hero.title"
              oninput="updateField(this)"
            />

            <label for="hero-subtitle">Sous-titre / Description</label>
            <textarea
              id="hero-subtitle"
              data-binding="hero.subtitle"
              oninput="updateField(this)"
            ></textarea>
          </div>
        </details>

        <!-- COORDONNÉES DE CONTACT -->
        <details class="config-group">
          <summary>Coordonnées & Contact</summary>
          <div class="group-content">
            <label for="contact-phone">Téléphone</label>
            <input
              type="text"
              id="contact-phone"
              data-binding="contact.phone"
              oninput="updateField(this)"
            />

            <label for="contact-email">Email</label>
            <input
              type="email"
              id="contact-email"
              data-binding="contact.email"
              oninput="updateField(this)"
            />
          </div>
        </details>

        <!-- GESTIONNAIRE DE CHAMBRES -->
        <details class="config-group">
          <summary>Chambres & Hébergements</summary>
          <div class="group-content">
            <div id="rooms-manager-container"></div>
            <button
              type="button"
              onclick="addRoom()"
              class="btn-primary"
              style="width: 100%; margin-top: 10px;"
            >
              + Ajouter une chambre
            </button>
          </div>
        </details>

        <!-- GESTIONNAIRE DU RESTAURANT -->
        <details class="config-group">
          <summary>Carte du Restaurant</summary>
          <div class="group-content">
            <div id="restaurant-manager-container"></div>
          </div>
        </details>

        <!-- GESTIONNAIRE DES SERVICES -->
        <details class="config-group">
          <summary>Services & Prestations</summary>
          <div class="group-content">
            <div id="services-manager-container"></div>
          </div>
        </details>
      </div>
    </aside>

    <!-- PRÉVISUALISATION TEMPS RÉEL (DROITE) -->
    <main class="customizer-preview">
      <iframe
        id="preview-frame"
        src="index.html"
        title="Aperçu du site en temps réel"
      ></iframe>
    </main>
  </body>
</html>
