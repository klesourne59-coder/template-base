<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Espace Administration</title>

    <style id="theme-styles">
      :root {
        --admin-bg: #0b1315;
        --admin-card-bg: #142123;
        --admin-primary: #c9a16f;
        --admin-font: Arial, sans-serif;
        --admin-text: #ffffff;
      }

      body {
        background-color: var(--admin-bg) !important;
        color: var(--admin-text) !important;
        font-family: var(--admin-font) !important;
        margin: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
      }

      .admin-card {
        background-color: var(--admin-card-bg);
        padding: 30px;
        border-radius: 12px;
        width: 400px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      }

      .admin-btn {
        background-color: var(--admin-primary);
        color: #000;
        border: none;
        padding: 10px 15px;
        border-radius: 6px;
        cursor: pointer;
        width: 100%;
        font-weight: bold;
      }

      fieldset {
        border: 1px solid #334155;
        border-radius: 8px;
        margin-top: 20px;
        padding: 15px;
      }

      .form-group {
        margin-bottom: 12px;
      }
      .form-group label {
        display: block;
        margin-bottom: 5px;
        font-size: 13px;
      }
      .form-group select,
      .form-group input {
        width: 100%;
        padding: 8px;
        border-radius: 4px;
        border: 1px solid #334155;
        background: #1e293b;
        color: #fff;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div class="admin-card">
      <h2>Connexion Administration</h2>

      <form style="margin-bottom: 20px;">
        <div class="form-group">
          <label>Identifiant</label>
          <input type="text" placeholder="admin" />
        </div>
        <button type="button" class="admin-btn">Se connecter</button>
      </form>

      <fieldset>
        <legend>Configuration de la page Admin</legend>

        <div class="form-group">
          <label>Police de la page Admin :</label>
          <select
            onchange="document.documentElement.style.setProperty('--admin-font', this.value); localStorage.setItem('admin_font', this.value);"
          >
            <option value="Arial, sans-serif">Arial</option>
            <option value="system-ui, sans-serif">Système</option>
            <option value="'Roboto', sans-serif">Roboto</option>
          </select>
        </div>

        <div class="form-group">
          <label>Couleur de fond de la page Admin :</label>
          <input
            type="color"
            value="#0b1315"
            oninput="document.documentElement.style.setProperty('--admin-bg', this.value); localStorage.setItem('admin_bg', this.value);"
          />
        </div>

        <div class="form-group">
          <label>Couleur du bouton de connexion :</label>
          <input
            type="color"
            value="#c9a16f"
            oninput="document.documentElement.style.setProperty('--admin-primary', this.value); localStorage.setItem('admin_primary', this.value);"
          />
        </div>
      </fieldset>
    </div>

    <script src="../editor-inline.js"></script>
  </body>
</html>
