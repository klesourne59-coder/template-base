<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connexion - Admin</title>
    <style>
      :root {
        --primary: #3b82f6;
        --primary-hover: #2563eb;
        --success: #10b981;
        --danger: #ef4444;
        --border: #e2e8f0;
        --bg: #f5f7fa;
        --text: #1e293b;
        --text-muted: #64748b;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Roboto", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        padding: 1rem;
      }

      .login-container {
        width: 100%;
        max-width: 400px;
        background: white;
        border-radius: 12px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        padding: 2.5rem;
        animation: slideUp 0.5s ease;
      }

      @keyframes slideUp {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .login-header {
        text-align: center;
        margin-bottom: 2rem;
      }

      .login-header h1 {
        font-size: 1.75rem;
        color: var(--text);
        margin-bottom: 0.5rem;
      }

      .login-header p {
        color: var(--text-muted);
        font-size: 0.95rem;
      }

      .login-icon {
        font-size: 3rem;
        margin-bottom: 1rem;
      }

      .login-form {
        display: flex;
        flex-direction: column;
        gap: 1.5rem;
      }

      .form-group {
        display: flex;
        flex-direction: column;
      }

      .form-group label {
        font-weight: 600;
        color: var(--text);
        margin-bottom: 0.5rem;
        font-size: 0.95rem;
      }

      .form-group input {
        padding: 0.75rem 1rem;
        border: 1px solid var(--border);
        border-radius: 8px;
        font-size: 1rem;
        font-family: inherit;
        transition: all 0.2s ease;
        background: white;
      }

      .form-group input:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      .form-group input::placeholder {
        color: var(--text-muted);
      }

      .btn-login {
        padding: 0.85rem;
        background: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 1rem;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.2s ease;
      }

      .btn-login:hover {
        background: var(--primary-hover);
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(59, 130, 246, 0.4);
      }

      .btn-login:active {
        transform: translateY(0);
      }

      .login-error {
        background: rgba(239, 68, 68, 0.1);
        border: 1px solid rgba(239, 68, 68, 0.3);
        color: #dc2626;
        padding: 0.75rem;
        border-radius: 8px;
        font-size: 0.9rem;
        display: none;
        text-align: center;
        animation: shake 0.3s ease;
      }

      .login-error.show {
        display: block;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        25% {
          transform: translateX(-10px);
        }
        75% {
          transform: translateX(10px);
        }
      }

      .login-footer {
        text-align: center;
        margin-top: 2rem;
        padding-top: 2rem;
        border-top: 1px solid var(--border);
      }

      .login-footer p {
        font-size: 0.85rem;
        color: var(--text-muted);
        margin-bottom: 1rem;
      }

      .login-footer a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
        transition: color 0.2s ease;
      }

      .login-footer a:hover {
        color: var(--primary-hover);
      }

      .password-reset {
        text-align: center;
        margin-top: 1rem;
      }

      .password-reset-link {
        color: var(--text-muted);
        font-size: 0.85rem;
      }

      @media (max-width: 480px) {
        .login-container {
          padding: 1.5rem;
        }

        .login-header h1 {
          font-size: 1.5rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="login-header">
        <div class="login-icon">🔐</div>
        <h1>Espace Admin</h1>
        <p>Accédez à votre panneau de gestion</p>
      </div>

      <form class="login-form" id="login-form">
        <div id="login-error" class="login-error"></div>

        <div class="form-group">
          <label for="password">Mot de passe</label>
          <input
            type="password"
            id="password"
            placeholder="Entrez votre mot de passe"
            required
            autofocus
          />
        </div>

        <button type="submit" class="btn-login">🔓 Accéder à l'Admin</button>
      </form>

      <div class="login-footer">
        <p>💡 Vous avez reçu un mot de passe lors de votre achat du template</p>
        <div class="password-reset-link">
          <p>
            Mot de passe oublié ?
            <a href="javascript:void(0)" onclick="showPasswordReset()"
              >Réinitialiser</a
            >
          </p>
        </div>
      </div>
    </div>

    <script>
      // Configuration - Changez ce mot de passe !
      const ADMIN_PASSWORD = "admin123"; // À remplacer par un mot de passe fort !

      document.getElementById("login-form").addEventListener("submit", (e) => {
        e.preventDefault();

        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("login-error");

        if (password === ADMIN_PASSWORD) {
          // Stocke l'accès dans le localStorage
          localStorage.setItem("admin_logged_in", "true");
          localStorage.setItem("admin_login_time", new Date().getTime());

          // Redirige vers l'admin
          window.location.href = "index.html";
        } else {
          // Affiche l'erreur
          errorDiv.textContent =
            "❌ Mot de passe incorrect. Veuillez réessayer.";
          errorDiv.classList.add("show");
          document.getElementById("password").focus();
          document.getElementById("password").value = "";

          setTimeout(() => {
            errorDiv.classList.remove("show");
          }, 3000);
        }
      });

      // Vérifie si l'utilisateur est déjà connecté
      window.addEventListener("load", () => {
        if (localStorage.getItem("admin_logged_in") === "true") {
          window.location.href = "index.html";
        }
      });

      function showPasswordReset() {
        alert(
          "📧 Pour réinitialiser votre mot de passe, contactez le support à support@example.com",
        );
      }
    </script>
  </body>
</html>
