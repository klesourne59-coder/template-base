<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-config="hero.title">Mon Établissement</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="config-loader.js" defer></script>
  </head>
  <body>
    <!-- EN-TÊTE / HERO -->
    <header class="hero">
      <h1 data-config="hero.title">Nom de l'établissement</h1>
      <p data-config="hero.subtitle">Description de votre établissement</p>
    </header>

    <main>
      <!-- SECTION CHAMBRES -->
      <section id="rooms-section" class="section-container">
        <h2>Nos Chambres</h2>
        <div id="rooms-list" class="rooms-grid">
          <!-- Contenu injecté dynamiquement par config-loader.js -->
        </div>
      </section>

      <!-- SECTION RESTAURANT -->
      <section id="restaurant-section" class="section-container">
        <h2>Notre Carte Restaurant</h2>
        <div id="restaurant-menu" class="restaurant-container">
          <!-- Contenu injecté dynamiquement par config-loader.js -->
        </div>
      </section>

      <!-- SECTION SERVICES -->
      <section id="services-section" class="section-container">
        <h2>Nos Services</h2>
        <div id="services-list" class="services-grid">
          <!-- Contenu injecté dynamiquement par config-loader.js -->
        </div>
      </section>
    </main>

    <!-- PIED DE PAGE -->
    <footer>
      <p>
        Téléphone :
        <a href="tel:" data-config="contact.phone">01 02 03 04 05</a> | Email :
        <a href="mailto:" data-config="contact.email">contact@hotel.com</a>
      </p>
    </footer>
  </body>
</html>
