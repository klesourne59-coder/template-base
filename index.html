<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-config="site.name">L'Écrin & Table</title>

    <!-- Feuille de styles principale (centralisée) -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Script de chargement dynamique de configuration -->
    <script src="config-loader.js" defer></script>
  </head>
  <body>
    <!-- NAVIGATION -->
    <header>
      <nav>
        <div class="brand">
          <img data-config="site.logo" src="" alt="Logo de l'établissement" />
          <span class="brand-name" data-config="site.name">Chargement...</span>
        </div>

        <div class="nav-contact">
          <a href="tel:" data-config="contact.phone">Téléphone</a>
          <a href="mailto:" data-config="contact.email">Email</a>
        </div>
      </nav>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
      <h1 data-config="hero.title">Bienvenue</h1>
      <p data-config="hero.subtitle">Découvrez nos prestations d'exception.</p>
    </section>

    <!-- SECTION CHAMBRES -->
    <section id="chambres" class="section-container">
      <h2 class="section-title">Chambres & Hébergements</h2>
      <div id="rooms-grid" class="cards-grid">
        <!-- Injecté dynamiquement par config-loader.js -->
      </div>
    </section>

    <!-- SECTION RESTAURANT -->
    <section id="restaurant" class="section-container">
      <h2 class="section-title">La Carte du Restaurant</h2>
      <div id="restaurant-grid" class="cards-grid">
        <!-- Injecté dynamiquement par config-loader.js -->
      </div>
    </section>

    <!-- SECTION SERVICES -->
    <section id="services" class="section-container">
      <h2 class="section-title">Services & Prestations</h2>
      <div id="services-grid" class="cards-grid">
        <!-- Injecté dynamiquement par config-loader.js -->
      </div>
    </section>

    <!-- PIED DE PAGE -->
    <footer>
      <p>
        &copy; <span data-config="site.name">Site</span> — Tous droits réservés.
      </p>
      <p>
        Contact : <a href="tel:" data-config="contact.phone">Tél</a> |
        <a href="mailto:" data-config="contact.email">Email</a>
      </p>
    </footer>
  </body>
</html>
